name: Выпуск npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  metadata:
    name: Допустить проверенный PR, проверить событие, тег и версии
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - name: Получить исходники тега
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Версия 7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # Версия 7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Проверить метаданные до сборки
        id: metadata
        run: |
          node scripts/release/event.mjs
          node scripts/release/relay.mjs check
          node scripts/release/relay.mjs notes
          node scripts/release/verified-pr.mjs verify
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}

  pack:
    name: Собрать окончательный tag SHA и упаковать один комплект
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - &checkout-release
        name: Получить допущенный коммит без сохранения авторизации
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Версия 7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - &node-release
        name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # Версия 7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - &npm-release
        name: Зафиксировать npm с поддержкой OIDC
        run: npm install --global npm@11.16.0
      - &pnpm-release
        name: Подготовить pnpm из packageManager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # Версия 4
        with:
          run_install: false
      - name: Установить зависимости из lockfile
        run: pnpm install --frozen-lockfile
      - name: Проверить checkout и собрать tag SHA один раз
        run: |
          node scripts/release/event.mjs
          node scripts/ci.mjs build
      - name: Упаковать три готовых dist без повторной сборки
        run: node scripts/ci.mjs pack
      - name: Связать байты с окончательным commit и tag
        run: node scripts/release/bundle.mjs create "$RUNNER_TEMP/npm-packages"
      - name: Сохранить неизменяемый комплект текущей попытки
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # Версия 7.0.1
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  smoke:
    name: Проверить независимую установку точного комплекта
    needs: [metadata, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELAY_RELEASE_BUNDLE: ${{ github.workspace }}/.artifacts/npm-packages
    steps:
      - *checkout-release
      - *node-release
      - *npm-release
      - *pnpm-release
      - &release-artifact-id
        name: Запретить загрузку всех артефактов при отсутствии ID
        run: node scripts/ci.mjs artifact-id
        env:
          ARTIFACT_ID: ${{ needs.pack.outputs.artifact_id }}
      - &download-release
        name: Получить точные байты из pack этого выпуска
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # Версия 8.0.1
        with:
          # Re-run failed publisher наследует этот ID от успешного pack без пересборки.
          artifact-ids: ${{ needs.pack.outputs.artifact_id }}
          digest-mismatch: error
          path: ${{ env.RELAY_RELEASE_BUNDLE }}
          merge-multiple: true
      - name: Проверить комплект, восстановить архивы и выполнить только package smoke
        run: |
          node scripts/release/event.mjs
          node scripts/release/bundle.mjs restore "$RELAY_RELEASE_BUNDLE"
          pnpm run package:smoke

  publish:
    name: Опубликовать только проверенный комплект
    needs: [metadata, pack, smoke]
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    concurrency:
      group: relay-npm-publish
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELAY_RELEASE_BUNDLE: ${{ github.workspace }}/.artifacts/npm-packages
    steps:
      - *checkout-release
      - *node-release
      - *npm-release
      - *pnpm-release
      - *release-artifact-id
      - *download-release
      - name: Повторно проверить актуальный PR-допуск, в том числе при publisher-only retry
        run: node scripts/release/verified-pr.mjs verify
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Повторно проверить событие и комплект перед OIDC-публикацией
        run: |
          node scripts/release/event.mjs
          node scripts/release/bundle.mjs verify "$RELAY_RELEASE_BUNDLE"
          test "$(pnpm exec npm --version)" = "11.16.0"
          pnpm run release:publish "$RELEASE_TAG"
