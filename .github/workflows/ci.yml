name: PR

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: relay-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: PR / Предварительные проверки
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &checkout
        name: Получить точный synthetic merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Версия 7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - &node
        name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # Версия 7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - &pnpm
        name: Подготовить pnpm из packageManager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # Версия 4
        with:
          run_install: false
      - &install
        name: Установить зависимости из lockfile
        run: pnpm install --frozen-lockfile
      - name: Проверить версию, формат, drift и документацию до генерации
        run: node scripts/ci.mjs preflight

  build:
    name: PR / Сборка
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - *checkout
      - *node
      - *pnpm
      - *install
      - name: Единственный производитель сборок и генерируемых выходов
        run: node scripts/ci.mjs build
      - name: Связать выходы с точным run, SHA и toolchain
        run: node scripts/ci.mjs capture "$RUNNER_TEMP/pr-build"
      - name: Сохранить неизменяемый снимок сборки
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # Версия 7.0.1
        with:
          # Это попытка producer. При Re-run failed jobs потребитель берёт прежний exact ID из needs.
          name: pr-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/pr-build
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  tooling:
    name: PR / Tooling
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *node
      - *pnpm
      - *install
      - &artifact-id
        name: Запретить загрузку при отсутствии точного ID
        run: node scripts/ci.mjs artifact-id
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      - &download-build
        name: Получить сборку только этого run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # Версия 8.0.1
        with:
          # Не восстанавливаем имя по текущему run_attempt: успешный build мог не перезапускаться.
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/pr-build
          merge-multiple: true
      - &restore-build
        name: Проверить run, SHA, toolchain и байты всех выходов до восстановления
        run: node scripts/ci.mjs restore "$RUNNER_TEMP/pr-build"
      - name: Тесты release, agents и skills
        run: node scripts/ci.mjs tooling

  lint-types:
    name: PR / Lint и типы
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *node
      - *pnpm
      - *install
      - *artifact-id
      - *download-build
      - *restore-build
      - name: Все workspace lint и typecheck без Turbo-сборок
        run: node scripts/ci.mjs lint-types

  libraries:
    name: PR / Библиотеки
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *node
      - *pnpm
      - *install
      - *artifact-id
      - *download-build
      - *restore-build
      - name: Тесты Core, Contracts и project-runtime
        run: node scripts/ci.mjs libraries

  server:
    name: PR / Server и runtime
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *node
      - *pnpm
      - *install
      - *artifact-id
      - *download-build
      - *restore-build
      - name: Тесты Server и server-runtime
        run: node scripts/ci.mjs server

  cli:
    name: PR / CLI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *node
      - *pnpm
      - *install
      - *artifact-id
      - *download-build
      - *restore-build
      - name: Тесты CLI на отдельном runner без конкуренции за CPU
        run: node scripts/ci.mjs cli

  mcp:
    name: PR / MCP
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *node
      - *pnpm
      - *install
      - *artifact-id
      - *download-build
      - *restore-build
      - name: Тесты MCP
        run: node scripts/ci.mjs mcp

  web-e2e:
    name: PR / Web E2E
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - *node
      - *pnpm
      - *install
      - *artifact-id
      - *download-build
      - *restore-build
      - name: Установить Chrome for Testing и системные зависимости
        run: pnpm exec agent-browser install --with-deps
      - name: Браузерные регрессии Web на собранных Server и CLI
        run: node scripts/ci.mjs web-e2e

  package-smoke:
    name: PR / Установка пакетов
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *node
      - name: Зафиксировать npm для упаковки
        run: npm install --global npm@11.16.0
      - *pnpm
      - *install
      - *artifact-id
      - *download-build
      - *restore-build
      - name: Упаковка существующих dist и независимые установки
        run: node scripts/ci.mjs package-smoke

  gate:
    name: PR / Все проверки
    if: always()
    needs:
      [preflight, build, tooling, lint-types, libraries, server, cli, mcp, web-e2e, package-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - *checkout
      - *node
      - name: Принять только success всех обязательных jobs
        run: node scripts/ci.mjs gate
      - name: Создать свидетельство проверенного synthetic merge
        run: node scripts/release/verified-pr.mjs create "$RUNNER_TEMP/pr-verification/verification.json"
      - name: Сохранить свидетельство текущей попытки
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # Версия 7.0.1
        with:
          name: pr-verification
          path: ${{ runner.temp }}/pr-verification/verification.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
