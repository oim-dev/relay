name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
  workflow_call:
    outputs:
      artifact_id:
        description: Идентификатор проверенных npm-архивов CLI, Server и MCP
        value: ${{ jobs.package.outputs.artifact_id }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: Проверки / Node.js 24
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Версия 7.0.1
        with:
          persist-credentials: false
      - name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # Версия 7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Подготовить pnpm из packageManager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # Версия 4
        with:
          run_install: false
      - name: Установить зависимости из lockfile
        run: pnpm install --frozen-lockfile
      - name: Проверить сохранённые результаты генераторов до сборки
        run: pnpm run agents:check && pnpm run skills:check
      - name: Проверить общую версию и собрать все пакеты
        run: pnpm run build
      - name: Проверить форматирование, типы, сборку и тесты
        shell: bash
        # CLI сам запускает три тестовых файла с дочерними процессами. Не делим
        # CPU runner с остальными наборами; stream сохраняет прогресс до завершения.
        run: |
          pnpm run check --filter='!@oim-dev/relay-cli' --log-order=stream 2>&1 | tee "$RUNNER_TEMP/tasks-check.log"
          pnpm exec turbo run lint typecheck test --filter=@oim-dev/relay-cli --log-order=stream 2>&1 | tee -a "$RUNNER_TEMP/tasks-check.log"
      - name: Показать причины падения проверок
        if: failure()
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const path = join(process.env.RUNNER_TEMP, 'tasks-check.log');
          const log = await readFile(path, 'utf8').catch(() => '');
          const lines = log.replace(/\u001b\[[0-9;]*m/g, '').split('\n');
          const encode = (text) => text.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          let reported = 0;
          for (let index = 0; index < lines.length && reported < 10; index++) {
            if (!/AssertionError|SyntaxError|TypeError|Error:|error TS\d+/.test(lines[index])) continue;
            console.log(`::error title=Причина падения проверки::${encode(lines.slice(Math.max(0, index - 2), index + 18).join('\n'))}`);
            reported++;
            index += 17;
          }
          if (!reported && log) console.log(`::error title=Проверки завершились с ошибкой::${encode(lines.slice(-60).join('\n'))}`);
          NODE

  package:
    name: Проверенные npm-архивы всех пакетов
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Версия 7.0.1
        with:
          persist-credentials: false
      - name: Подготовить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # Версия 7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Зафиксировать версию npm для упаковки
        run: npm install --global npm@11.16.0
      - name: Подготовить pnpm из packageManager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # Версия 4
        with:
          run_install: false
      - name: Установить зависимости из lockfile
        run: pnpm install --frozen-lockfile
      - name: Проверить независимые установки CLI, Server и MCP в local/workspace
        run: pnpm run package:check
      - name: Связать проверенные архивы с коммитом и общей версией
        run: node scripts/release/bundle.mjs create "$RUNNER_TEMP/npm-packages"
      - name: Сохранить все проверенные архивы одним артефактом
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # Версия 7.0.1
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14
